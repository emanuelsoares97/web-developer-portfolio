    <main>
      <section class="contact">
        <h2 data-i18n="contact-title">Contact Me</h2>
        <p data-i18n="contact-subtitle">If you'd like to get in touch, feel free to send me a message!</p>
    
        <div class="contact-info">
            <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
              
              <input type="hidden" name="access_key" value="30ef2fb1-d736-4d8f-b3d2-daa4e03d899d">
              <input type="hidden" name="subject" value="New portfolio contact message">
              <input type="checkbox" name="botcheck" class="hidden" style="display: none;">
              <input type="text" id="name" name="name" placeholder="Your name" data-i18n-placeholder="name" required>
              <input type="email" id="email" name="email" placeholder="Your email" data-i18n-placeholder="email" required>
              <textarea id="message" name="message" placeholder="Your message" data-i18n-placeholder="message" required></textarea>
              <button type="submit" data-i18n="contact-btn-send">Send</button>
            </form>
            <div id="status"></div>
    
            <div class="social-links">
                <p data-i18n="contact-or">Or connect with me on:</p>
                <a href="https://www.linkedin.com/in/emanuel-soares1997" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                <a href="https://github.com/emanuelsoares97" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a href="https://www.instagram.com/tutasoares_" target="_blank" rel="noopener noreferrer">Instagram</a>
            </div>
        </div>
    </section>
